# BACKUP pinger only. The primary 5-minute loop runs on cron-job.org
# (exact timing, free) hitting the same endpoint with the same Bearer secret.
# GitHub cron drifts/skips under load, so it's demoted to a 30-min safety net —
# if cron-job.org ever lapses, odds still refresh at least twice an hour.
#
# Setup (one-time): repo → Settings → Secrets and variables → Actions →
# add secret CRON_SECRET with the same value as the Railway env var.
name: Tregu Live Refresh (backup)

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Refresh market odds from news
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # 383lajme.vercel.app answers 402 — the Vercel account is blocked and
          # production has been served by Railway behind Cloudflare since the
          # move. Every other workflow here already points at the live host;
          # this one was missed, so the news repricer has been pinging a dead
          # endpoint on every scheduled run.
          BASE: ${{ secrets.PRODUCTION_URL || 'https://383ks.com' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repo secret is not set — skipping." >&2
            exit 1
          fi
          # pipefail, because `curl | head` exits with head's status. Without it
          # this step swallowed curl's 402 and the run reported success — which
          # is how a dead endpoint went unnoticed across many scheduled runs.
          set -o pipefail
          curl -fsS --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE/api/cron/update-markets" \
            | head -c 2000
