# Is the fuel card serving live prices, or the hardcoded fallback?
#
# The card rendered 29 July prices under a "Rifreskim ditor" label for weeks
# while the same request answered 200 from a laptop, so the failure is specific
# to the render path and invisible from outside. This asks production directly.
#
# Manual by default. The daily schedule is a smoke test: if the card silently
# reverts to the fallback again, a red run says so on the day it happens
# instead of a reader noticing weeks later.
name: Fuel card health

on:
  workflow_dispatch:
  schedule:
    - cron: "40 6 * * *"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Vercel's render path gets a Cloudflare challenge from this API. Whether
      # a CI runner does too decides the fix: if the runner is allowed through,
      # the prices can be fetched here and committed for the page to read.
      - name: Can this runner reach NaftaSot directly?
        continue-on-error: true
        run: |
          code=$(curl -sS -o direct.json -w '%{http_code}' --max-time 45             -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'             -H 'Accept: application/json'             'https://api.naftasot.com/api/public/bootstrap?sort_by=cheapest' || true)
          echo "api.naftasot.com -> HTTP $code"
          head -c 160 direct.json; echo
          code2=$(curl -sS -o site.html -w '%{http_code}' --max-time 45             -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'             'https://naftasot.com/' || true)
          echo "naftasot.com -> HTTP $code2"

      - name: Ask production what it is serving
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repo secret is not set." >&2
            exit 1
          fi

          curl -sS --max-time 60 -o probe.json \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://www.383ks.com/api/automation/fuel"

          node -e '
            const d = require("./probe.json");
            console.log("upstream :", JSON.stringify(d.upstream));
            console.log("serving  :", d.serving);
            if (d.fallbackReason) console.log("reason   :", d.fallbackReason);
            console.log("latency  :", d.ms + "ms");
            for (const b of d.brands ?? []) {
              console.log(`  ${String(b.brand).padEnd(16)} ${b.diesel} / ${b.petrol} / ${b.gas ?? "—"}   ${b.oldest} → ${b.newest}`);
            }
            // A card quietly serving weeks-old numbers is the thing being watched
            // for, so it fails the run rather than passing quietly.
            if (d.serving !== "live") {
              console.log("::error::Fuel card is serving the hardcoded fallback");
              process.exit(1);
            }
          '
