# Drafts tomorrow's Sondazhi i Ditës from the day's news, once a night.
#
# It writes a DRAFT. Nothing reaches a reader until it is approved at
# /admin/poll, and a day nobody reviews still renders: the card falls back to
# the static bank in lib/polls-data.ts. So a failed run costs a topical
# question, never a blank card.
#
# Runs at 21:10 UTC — 23:10 in Kosovo, after the evening news pass and with
# time to review before the poll goes live at local midnight.
#
# Setup (one-time): repo → Settings → Secrets and variables → Actions →
# CRON_SECRET, matching the Vercel env var of the same name. The route accepts
# either CRON_SECRET or TREGU_AUTOMATION_SECRET.
name: Sondazhi i Ditës — draft tomorrow's question

on:
  schedule:
    - cron: "10 21 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Read-only context, printed first so a failure below has something to be
      # diagnosed against: how many articles were available, how many were
      # local, and which provider env NAMES the function can actually see.
      # No secret value is returned by that endpoint. A diagnostic must never
      # fail the job it exists to explain, hence continue-on-error.
      - name: Context
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS --max-time 60 -o context.json \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://www.383ks.com/api/automation/sondazhi/draft"
          node -e '
            const d = require("./context.json");
            console.log("todayKey     :", d.todayKey);
            console.log("drafting for :", d.draftFor);
            const arts = d.articles || [];
            console.log("articles     :", arts.length, "| local:", arts.filter(a => a.local).length);
            for (const a of arts.slice(0, 5)) {
              console.log("   ", a.local ? "[LOKALE]" : "[BOTE]  ", String(a.title || "").slice(0, 70));
            }
            console.log("provider env :");
            for (const e of d.providerEnv || ["(none reported)"]) console.log("   ", e);
          '

      - name: Draft tomorrow's poll question
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repo secret is not set — cannot authenticate." >&2
            exit 1
          fi

          # Not -f: a 422 is the validator refusing a weak question, which is
          # the system working. The body says which it was, so it is captured
          # either way and the status is judged below.
          status=$(curl -sS --max-time 120 -o response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://www.383ks.com/api/automation/sondazhi/draft")

          echo "HTTP $status"
          head -c 2000 response.json
          echo

          case "$status" in
            200)
              # A skipped run is also a success: it means the day already has
              # an approved question and the job refused to clobber it.
              echo "Draft written, or skipped because the day is already approved."
              ;;
            422)
              echo "::warning::No question passed validation today; the static bank covers the day."
              ;;
            *)
              echo "::error::Draft run failed with HTTP $status"
              exit 1
              ;;
          esac
