name: Dosje subjects

# Which of the new articles belong to a standing subject.
#
# Mirrors the news cadence with its own offset rather than chaining to it —
# tone-scraper uses :23 for the same reason, and this repo has no workflow_run
# anywhere. A research outage must never hold up publishing.
#
# Cheap by design: string matching over articles already in the database. No
# model, no fetching. The expensive half is dosje-research, which this feeds.

on:
  schedule:
    - cron: "43 5,7,9,11,13,15,17,19,21 * * *"
  workflow_dispatch:

jobs:
  subjects:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Map articles to dossiers
        env:
          BASE: ${{ secrets.PRODUCTION_URL || 'https://www.383ks.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          status=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE/api/automation/dosje/subjects")
          cat /tmp/out.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::subject detection failed with HTTP $status"
            exit 1
          fi
          echo "::notice::$(cat /tmp/out.json)"

  media:
    runs-on: ubuntu-latest
    needs: subjects
    timeout-minutes: 15
    steps:
      - name: Propose photographs and re-check videos
        env:
          BASE: ${{ secrets.PRODUCTION_URL || 'https://www.383ks.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Proposes only; nothing here can publish an image. A video that has
          # stopped answering is taken off the site rather than left broken.
          status=$(curl -sS -o /tmp/media.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE/api/automation/dosje/media?limit=10")
          cat /tmp/media.json; echo
          if [ "$status" != "200" ]; then
            echo "::warning::media pass returned HTTP $status"
            exit 0
          fi
          echo "::notice::$(cat /tmp/media.json)"
