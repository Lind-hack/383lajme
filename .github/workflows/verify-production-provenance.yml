name: Verify production provenance

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-production-provenance
  # A newer main commit supersedes any earlier verification target. Keeping an
  # old guard run alive could otherwise repair an obsolete commit after a newer
  # release is already available.
  cancel-in-progress: true

jobs:
  verify-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify the production alias points to GitHub main
        id: verify
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PRODUCTION_URL: https://383lajme.vercel.app
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            payload="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "${PRODUCTION_URL}/api/deployment-info?verify=${GITHUB_RUN_ID}-${attempt}" || true)"
            if [ -n "$payload" ]; then
              if node -e '
                const [payload, expected] = process.argv.slice(1);
                const data = JSON.parse(payload);
                process.exit(
                  data.commit_sha === expected &&
                  data.commit_ref === "main" &&
                  data.environment === "production" &&
                  data.deployment_source === "github-main"
                    ? 0
                    : 1,
                );
              ' "$payload" "$EXPECTED_SHA"; then
                echo "Production verified at ${EXPECTED_SHA}"
                exit 0
              fi
            fi
            sleep 15
          done
          echo "Production did not reach expected GitHub main commit ${EXPECTED_SHA}" >&2
          exit 1
