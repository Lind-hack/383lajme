name: Dosje research

# One subject a night, drafted and left for review.
#
# Deliberately not chained to codex-cloud-news. This repo has no workflow_run
# anywhere: tone-scraper mirrors the news cadence with its own offset, and
# dispatch-telegram polls on its own clock with a ledger. The same reasoning
# applies here and more strongly — a research outage must never be able to
# delay publishing, and nothing this job produces is urgent.
#
# A refusal is the system working. 422 means the evidence did not support a
# claim, and the job exits 0 with a warning rather than paging anyone.

on:
  schedule:
    - cron: "25 22 * * *"
  workflow_dispatch:
    inputs:
      subject:
        description: "Subject to research (leave empty to let the job choose)"
        required: false
      topic:
        description: "Dossier slug (leave empty to let the job choose)"
        required: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Draft whichever dossier the news has been returning to
        env:
          BASE: ${{ secrets.PRODUCTION_URL || 'https://www.383ks.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL || 'lindsylqa@gmail.com' }}
          SUBJECT: ${{ inputs.subject }}
          TOPIC: ${{ inputs.topic }}
        run: |
          # With no subject named, the route asks the database which dossier is
          # most worth researching now: recurring in recent news, not on
          # cooldown, waiting longest. That is what connects this job to the
          # subject detection that runs every two hours — before, it ran on a
          # hardcoded subject and ignored all of it.
          QUERY=""
          if [ -n "$SUBJECT" ] && [ -n "$TOPIC" ]; then
            QUERY="?subject=$(printf %s "$SUBJECT" | jq -sRr @uri)&topic=$TOPIC"
            echo "Subject named by hand: $SUBJECT -> $TOPIC"
          else
            echo "No subject named; the job will choose."
          fi

          python3 scripts/dosje_cron_report.py \
            --stage research \
            --url "$BASE/api/automation/dosje/research$QUERY" \
            --allowed-status 200,422 \
            --workflow-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --event "$GITHUB_EVENT_NAME"
