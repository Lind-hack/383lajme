name: Dosje research

# One subject a night, drafted and left for review.
#
# Deliberately not chained to codex-cloud-news. This repo has no workflow_run
# anywhere: tone-scraper mirrors the news cadence with its own offset, and
# dispatch-telegram polls on its own clock with a ledger. The same reasoning
# applies here and more strongly — a research outage must never be able to
# delay publishing, and nothing this job produces is urgent.
#
# A refusal is the system working. 422 means the evidence did not support a
# claim, and the job exits 0 with a warning rather than paging anyone.

on:
  schedule:
    - cron: "25 22 * * *"
  workflow_dispatch:
    inputs:
      subject:
        description: "Subject to research"
        required: true
      topic:
        description: "Dossier slug it belongs to"
        required: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Look at the evidence first
        env:
          BASE: ${{ secrets.PRODUCTION_URL || 'https://www.383ks.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUBJECT: ${{ inputs.subject || 'KFOR Kosovo' }}
        run: |
          echo "Subject: $SUBJECT"
          curl -sS -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE/api/automation/dosje/research?subject=$(printf %s "$SUBJECT" | jq -sRr @uri)" \
            | tee /tmp/evidence.json
          echo

      - name: Draft, and accept a refusal
        env:
          BASE: ${{ secrets.PRODUCTION_URL || 'https://www.383ks.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUBJECT: ${{ inputs.subject || 'KFOR Kosovo' }}
          TOPIC: ${{ inputs.topic || 'kfor' }}
        run: |
          status=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE/api/automation/dosje/research?subject=$(printf %s "$SUBJECT" | jq -sRr @uri)&topic=$TOPIC")
          cat /tmp/out.json; echo
          case "$status" in
            200) echo "::notice::drafted for review" ;;
            422) echo "::warning::refused — evidence did not support a claim. This is correct behaviour." ; exit 0 ;;
            *)   echo "::error::research failed with HTTP $status" ; exit 1 ;;
          esac
