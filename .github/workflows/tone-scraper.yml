name: Tone Scraper

on:
  schedule:
    # Matches codex-cloud-news.yml's Kosovo-time cadence — 07:00-23:00 local,
    # every 2h (Europe/Pristina summer/CEST is UTC+2) — so Bota Flet gets new
    # articles alongside the main news pipeline instead of once a day.
    # Same :23 offset as before, to stay off Actions' :00 peak load.
    - cron: "23 5,7,9,11,13,15,17,19,21 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install feedparser groq requests beautifulsoup4 googlenewsdecoder

      - name: Run tone scraper
        run: python tools/tone_scraper.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Translation, article blurbs and topic labels run on Gemini so they
          # stop competing with stance classification for Groq's 100K daily
          # tokens — a full bucket used to leave a whole run UNKNOWN, which
          # means excluded from the index entirely. Without this secret the
          # pipeline still produces an index, just without those extras.
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}

      # Attribution runs here, not in the scraper. A feed entry's link is a
      # news.google.com redirect, so which country's press published a story is
      # only knowable once the URL has been resolved and cached — which is what
      # the scraper above has just finished doing. This re-derives the published
      # files from that cache: it drops score tables and federations, discards
      # articles about villages called Kosowo, and files every remaining article
      # under the country of its own outlet rather than the feed that found it.
      - name: Re-derive the published index from the cache
        run: python tools/tone_rebuild.py

      - name: Commit updated tone data
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/tone-outlets.json public/tone-history.json public/tone-article-cache.json public/tone-topics.json public/tone-outlet-history.json
          if git diff --cached --quiet; then
            echo "No tone data changes"
            exit 0
          fi
          git commit -m "chore: update tone outlets data [skip ci]"
          git pull --rebase --autostash origin main
          git push
