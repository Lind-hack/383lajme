# Reads NaftaSot and pushes the prices to 383, four times a day.
#
# A plain fetch from here gets Cloudflare's "Just a moment..." interstitial —
# measured 403 from both this runner and Railway's render path, while the same
# request answers 200 from a residential connection. That page is a JavaScript
# challenge rather than a hard block, so it is issued to a real browser and
# solved by one: Playwright drives Chromium, Cloudflare hands over its cookie,
# and the JSON arrives.
#
# If Cloudflare ever escalates to a block that a browser cannot clear, this job
# fails loudly and scripts/push-fuel-prices.mjs still works by hand from any
# residential connection.
#
# Four runs a day. The card dates each brand by the last check, so the check
# has to land early every Kosovo day. A single 05:40 UTC slot was being run by
# GitHub around 10:15 UTC — 4.5 hours late — which left the card saying
# "yesterday" until lunchtime, and a failed run (20 and 21 Sep) cost a whole day.
#
#   23:10 UTC  just after Kosovo midnight all year (01:10 CEST / 00:10 CET)
#   04:10 UTC  early morning, after NaftaSot's overnight updates
#   10:10 UTC  midday
#   16:10 UTC  evening, catches same-day price changes
#
# Off the hour on purpose: GitHub's scheduler is busiest at :00.
name: Fuel prices — daily push

on:
  schedule:
    - cron: "10 23 * * *"
    - cron: "10 4 * * *"
    - cron: "10 10 * * *"
    - cron: "10 16 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # v5 runs on Node 24. v4 declares a Node 20 runtime, which GitHub has
      # deprecated and already force-upgrades, warning on every run.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      # --ignore-scripts because this job drives a browser and nothing else.
      # Without it npm compiles better-sqlite3 and sharp on every run — two
      # native builds, neither of which this script imports, each of them a way
      # for the daily price push to fail at something unrelated to prices.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund || npm install --ignore-scripts --no-audit --no-fund

      # The browser binary has to match the playwright-core already in the
      # lockfile, so the version is read from it rather than pinned twice.
      - name: Install Chromium
        run: |
          VERSION=$(node -p "require('playwright-core/package.json').version")
          echo "playwright-core $VERSION"
          npx --yes "playwright@$VERSION" install --with-deps chromium

      - name: Read NaftaSot through a real browser and push
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/fetch-fuel-via-browser.mjs
